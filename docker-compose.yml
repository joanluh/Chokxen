services:
  db:
    image: mysql:8.0
    container_name: chokxen_mysql
    restart: always
    environment:
      MYSQL_DATABASE: chokxen
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: chokxen_user
      MYSQL_PASSWORD: chokxen_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - chokxen-net

  backend:
    build: ./backend
    container_name: chokxen_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql+pymysql://chokxen_user:chokxen_password@db:3306/chokxen
    depends_on:
      - db
    volumes:
      - ./backend:/app
    networks:
      - chokxen-net

volumes:
  mysql_data:

networks:
  chokxen-net:
    driver: bridge