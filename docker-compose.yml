services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chokxen
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_USER: ${MYSQL_USER:-chokxen_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    networks: [chokxen-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-chokxen_user}:${MYSQL_PASSWORD}@db:3306/chokxen
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db: {condition: service_healthy}
    networks: [chokxen-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_DEMO: ${VITE_ENABLE_DEMO:-true}
    restart: unless-stopped
    ports: ["${FRONTEND_BIND:-127.0.0.1}:5173:5173"]
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend: {condition: service_healthy}
    networks: [chokxen-net]
volumes:
  mysql_data:
networks:
  chokxen-net:
    driver: bridge
