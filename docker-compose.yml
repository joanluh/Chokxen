services:
  db:
    image: mysql:8.0
    container_name: chokxen_mysql
    restart: always
    environment:
      MYSQL_DATABASE: chokxen
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: chokxen_user
      MYSQL_PASSWORD: chokxen_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - chokxen-net

  redis:
    image: redis:7-alpine
    container_name: chokxen_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - chokxen-net

  backend:
    build: ./backend
    container_name: chokxen_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://chokxen_user:chokxen_password@db:3306/chokxen_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - chokxen-net

volumes:
  mysql_data:

networks:
  chokxen-net:
    driver: bridge